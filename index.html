<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Resume</title>
  <style>
    body { margin: 0; overflow: hidden; }
    canvas { display: block; }
  </style>
</head>
<body>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/110/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.110.0/examples/js/loaders/GLTFLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.110.0/examples/js/controls/OrbitControls.js"></script>
  <script>
    // Створення сцени
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer();
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    // Освітлення
    const light = new THREE.DirectionalLight(0xffffff, 10);
    light.position.set(1, 1, 1).normalize();
    scene.add(light);

    // Контролери орбіти
    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true; // Додавання інерції
    controls.dampingFactor = 0.05;

    // Завантаження моделі
    const loader = new THREE.GLTFLoader();
    loader.load('./3dobj/pixelMixeer.gltf', function(gltf) {
      scene.add(gltf.scene);
      gltf.scene.position.set(0, -1, 0); // Розміщення моделі
    });

    // Камера
    camera.position.set(0, 1, 5); // Змінена початкова позиція камери

    // Анімація
    function animate() {
      requestAnimationFrame(animate);
      controls.update(); // Оновлення контролерів
      renderer.render(scene, camera);
    }
    animate();

    // Обробка зміни розміру вікна
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
