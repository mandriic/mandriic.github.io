<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scroll Sync Video</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: black;
        }

        #video-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        video {
            width: 100%;
            height: auto;
        }
    </style>
</head>
<body>
    <div id="video-container">
        <video id="scrollVideo" muted playsinline>
            <source src="0.mp4" type="video/mp4">
            Your browser does not support the video tag.
        </video>
    </div>
    <script>
        const video = document.getElementById('scrollVideo');
        
        // Коли відео завантажиться
        video.addEventListener('loadedmetadata', () => {
            const duration = video.duration; // Тривалість відео
            const totalFrames = 5000; // Умовна кількість кадрів
            
            // Відстеження прокрутки
            document.addEventListener('wheel', (event) => {
                // Накопичуємо значення прокрутки
                const delta = event.deltaY * 0.1; // Чутливість
                let scrollPosition = (video.currentTime / duration) * totalFrames + delta;

                // Нормалізуємо значення в межах [0, totalFrames]
                if (scrollPosition > totalFrames) scrollPosition = 0;
                if (scrollPosition < 0) scrollPosition = totalFrames;

                // Встановлюємо новий час відео
                const currentTime = (scrollPosition / totalFrames) * duration;
                video.currentTime = currentTime;
            });
        });
    </script>
</body>
</html>
